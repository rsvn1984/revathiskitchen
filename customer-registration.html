<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - Revathi's Kitchen</title>
    <link rel="stylesheet" href="css/customer-registration.css">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
</head>

<body>

    <div class="registration-container">

        <div class="registration-card">

            <div class="registration-title">
                <h1>Customer Registration</h1>
                <p>Create your Revathi's Kitchen customer account</p>
            </div>

            <form id="customer-registration-form" novalidate>

<section class="registration-section">

    <h2>Login Details</h2>

    <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input
            type="tel"
            id="mobile"
            name="mobile"
            placeholder="Enter your mobile number"
            required
        >
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >
    </div>

    <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Re-enter your password"
            required
        >
    </div>

</section>
<section class="registration-section">

    <h2>Customer Details</h2>

    <div class="form-group">
        <label for="customer-name">Customer Name</label>
        <input
            type="text"
            id="customer-name"
            name="customer-name"
            placeholder="Enter your full name"
            required
        >
    </div>

    <div class="form-group">
        <label for="email">Email ID</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
        >
    </div>

</section>
<section class="registration-section">

    <h2>Delivery Details</h2>

    <div class="form-group">
        <label for="address">Address</label>
        <textarea
            id="address"
            name="address"
            rows="4"
            placeholder="Enter your complete delivery address"
            required
        ></textarea>
    </div>

    <div class="form-group">

        <label>Delivery Location</label>

        <div class="location-buttons">

            <button
                type="button"
                id="current-location"
                class="current-location"
            >
                📍 Use My Current Location
            </button>

            <button
                type="button"
                id="map-location"
                class="map-location"
            >
                🗺️ Choose Location on Map
            </button>

        </div>

        <p id="location-status" class="location-status">
            Location not selected
        </p>
    <div id="map-container" class="map-container">
        <div id="location-map"></div>

        <button type="button" id="confirm-map-location">
        📍 Confirm This Location
        </button>
        </div>
    </div>

    <input type="hidden" id="latitude" name="latitude">
    <input type="hidden" id="longitude" name="longitude">

</section>
<section class="registration-section">

    <button
        type="submit"
        id="register-button"
        class="register-button"
    >
        Create My Account
    </button>

</section>
</form>    
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/customer-registration.js"></script>
</body>
</html>
